        <h1>Kontakta mig</h1>

        <!-- Contact form -->
        <form>
            <fieldset>
                <legend>Kontaktformulär</legend>
                <label for="name">Namn:</label>
                <input type="text" id="name" name="name" required placeholder="Förnamn Efternamn"><br>

                <input type="email" id="email" name="email" required placeholder="exempel@exempel.se"><br>
                <label for="message">Meddelande:</label>
                <textarea id="message" name="message" required rows="10"></textarea><br>
                <button type="submit">Skicka</button>
            </fieldset>
        </form>
        <p>Du kan också nå mig direkt på <a href="mailto:mawe2607@student.miun.se">mawe2607@student.miun.se.</a></p>
